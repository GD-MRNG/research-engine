[project]
name = "research-engine"
version = "0.1.0"
description = "Research pipeline engine for web scraping, LLM synthesis, and blog post publishing"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "selenium>=4.35.0",
    "pandas>=2.3.2",
    "beautifulsoup4>=4.13.5",
    "ollama>=0.5.3",
    "langchain-community>=0.3.29",
    "langchain-core>=0.3.75",
    "google-api-python-client>=2.181.0",
    "openai>=1.107.0",
    "youtube-transcript-api>=1.2.2",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.1",
    "faster-whisper>=1.1.1",
    "torch==2.7.0",
    "torchaudio==2.7.0",
    "requests>=2.32.5",
    "pymupdf4llm>=0.2.9",
    "ebooklib>=0.20",
    "pymupdf-layout>=1.26.6",
    "jinja2>=3.1.6",
    "boto3>=1.42.53",
    "scrapling[fetchers]>=0.4.8",
    "langchain-ollama>=1.1.0",
    "gradio>=5.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
